<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <title>Anatomy Drill</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@500&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Layout: single column, 44rem max. Chapters stack as bands of selectable sections; a sticky bar holds the Start button.
   Palette is a histology slide: hematoxylin ink (blue-violet) on eosin-tinted paper, with eosin pink as the one accent. */
      :root {
        --bg: #faf4f8;
        --surface: #ffffff;
        --tint: #f3eaf4;
        --fg: #241f45;
        --muted: #625c88;
        --line: #e2d6e6;
        --accent: #bf3470;
        --accent-fg: #ffffff;
        --hema: #3f3b8f;
        --ok: #17704f;
        --ok-bg: #e1f3e9;
        --bad: #a93428;
        --bad-bg: #fbe7e4;
        --f-display:
          "Bricolage Grotesque", ui-sans-serif, system-ui, -apple-system,
          "Segoe UI", sans-serif;
        --f-body:
          "Source Sans 3", ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          sans-serif;
        --f-mono:
          "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #13112a;
          --surface: #1c1a3a;
          --tint: #25224a;
          --fg: #eee9f8;
          --muted: #a59fcb;
          --line: #34305f;
          --accent: #f2709f;
          --accent-fg: #1f0a16;
          --hema: #a29cf5;
          --ok: #62d3a6;
          --ok-bg: #11342a;
          --bad: #ff9084;
          --bad-bg: #3b1c22;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #13112a;
        --surface: #1c1a3a;
        --tint: #25224a;
        --fg: #eee9f8;
        --muted: #a59fcb;
        --line: #34305f;
        --accent: #f2709f;
        --accent-fg: #1f0a16;
        --hema: #a29cf5;
        --ok: #62d3a6;
        --ok-bg: #11342a;
        --bad: #ff9084;
        --bad-bg: #3b1c22;
        color-scheme: dark;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--f-body);
        font-size: 1.0625rem;
        line-height: 1.5;
        padding-block: 28px 0;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        min-height: 100vh;
      }
      .wrap {
        max-width: 44rem;
        margin: 0 auto;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1,
      h2,
      h3,
      .display {
        font-family: var(--f-display);
        text-wrap: balance;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      :focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }
      .mono {
        font-family: var(--f-mono);
        font-weight: 500;
      }

      /* ---------- home ---------- */
      .mast {
        display: grid;
        gap: 10px;
        padding-bottom: 22px;
      }
      .eyebrow {
        font-family: var(--f-mono);
        font-size: 0.78rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .mast h1 {
        font-size: clamp(2.3rem, 8vw, 3.4rem);
        line-height: 1;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--hema);
      }
      .lede {
        color: var(--muted);
        max-width: 34rem;
      }
      .stats {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 22px;
        margin: 8px 0 0;
        font-size: 0.95rem;
      }
      .stats div {
        display: flex;
        gap: 6px;
        align-items: baseline;
      }
      .stats dt {
        color: var(--muted);
      }
      .stats dd {
        margin: 0;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .missed-btn {
        justify-self: start;
        margin-top: 4px;
      }

      .chapter {
        margin-top: 26px;
      }
      .ch-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 12px;
        padding-bottom: 8px;
        border-bottom: 2px solid var(--hema);
      }
      .ch-num {
        font-family: var(--f-mono);
        font-weight: 500;
        font-size: 0.9rem;
        color: var(--accent);
      }
      .ch-head h2 {
        font-size: 1.3rem;
        font-weight: 700;
        flex: 1 1 14rem;
        min-width: 0;
      }
      .ch-actions {
        display: flex;
        gap: 14px;
      }
      .link {
        background: none;
        border: 0;
        padding: 6px 0;
        color: var(--hema);
        font-weight: 600;
        font-size: 0.92rem;
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .secs {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .secs li {
        border-bottom: 1px solid var(--line);
      }
      .sec {
        display: grid;
        grid-template-columns: auto auto 1fr;
        gap: 4px 12px;
        align-items: center;
        padding: 12px 2px 6px;
        cursor: pointer;
      }
      .sec input {
        width: 1.2rem;
        height: 1.2rem;
        margin: 0;
        accent-color: var(--accent);
      }
      .tag {
        font-family: var(--f-mono);
        font-weight: 500;
        font-size: 0.92rem;
        color: var(--hema);
        background: var(--tint);
        border-radius: 4px;
        padding: 1px 7px;
      }
      .stitle {
        min-width: 0;
        font-weight: 600;
        line-height: 1.3;
      }
      .meter {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 2px 12px 2.4rem;
        color: var(--muted);
        font-size: 0.85rem;
        font-variant-numeric: tabular-nums;
      }
      .bar {
        flex: 1;
        height: 5px;
        border-radius: 3px;
        background: var(--tint);
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--hema);
        border-radius: 3px;
      }

      .startbar {
        position: sticky;
        bottom: 0;
        z-index: 5;
        margin-top: 26px;
        background: var(--bg);
        border-top: 1px solid var(--line);
        padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px));
        display: flex;
        flex-wrap: wrap;
        gap: 10px 18px;
        align-items: center;
      }
      .opts {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 14px;
        flex: 1 1 14rem;
        min-width: 0;
      }
      .opt-label {
        font-size: 0.85rem;
        color: var(--muted);
      }
      .chips {
        display: flex;
        gap: 6px;
      }
      .chip {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 999px;
        padding: 4px 14px;
        min-height: 36px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }
      .chip[aria-pressed="true"] {
        background: var(--hema);
        border-color: var(--hema);
        color: var(--bg);
      }
      .check {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.92rem;
        cursor: pointer;
      }
      .check input {
        accent-color: var(--accent);
        width: 1.1rem;
        height: 1.1rem;
        margin: 0;
      }
      .btn {
        border: 2px solid var(--accent);
        background: var(--accent);
        color: var(--accent-fg);
        font-weight: 700;
        border-radius: 8px;
        padding: 10px 20px;
        min-height: 46px;
        font-family: var(--f-display);
        font-size: 1rem;
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn.ghost {
        background: transparent;
        color: var(--accent);
      }
      .btn.small {
        min-height: 38px;
        padding: 6px 14px;
        font-size: 0.92rem;
      }
      .foot {
        margin-top: 30px;
        padding-bottom: 28px;
        color: var(--muted);
        font-size: 0.88rem;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 16px;
        align-items: center;
      }

      /* ---------- quiz ---------- */
      .qtop {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 12px;
      }
      .qcount {
        font-family: var(--f-mono);
        font-size: 0.9rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .progress {
        height: 6px;
        background: var(--tint);
        border-radius: 3px;
        overflow: hidden;
      }
      .progress i {
        display: block;
        height: 100%;
        background: var(--accent);
        transition: width 0.25s ease;
      }
      .qmeta {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        margin-top: 26px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .qtext {
        font-size: clamp(1.25rem, 4.2vw, 1.55rem);
        line-height: 1.3;
        font-weight: 600;
        margin-top: 10px;
      }
      .answers {
        list-style: none;
        margin: 20px 0 0;
        padding: 0;
        display: grid;
        gap: 10px;
      }
      .ans {
        width: 100%;
        text-align: left;
        display: grid;
        grid-template-columns: 2rem 1fr auto;
        gap: 12px;
        align-items: start;
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        min-height: 54px;
      }
      .ans:hover:not(:disabled) {
        border-color: var(--hema);
      }
      .ans .key {
        font-family: var(--f-mono);
        font-weight: 500;
        font-size: 0.85rem;
        color: var(--hema);
        background: var(--tint);
        border-radius: 5px;
        text-align: center;
        padding: 2px 0;
        margin-top: 1px;
      }
      .ans .mark {
        font-weight: 800;
      }
      .ans.picked {
        border-color: var(--hema);
        background: var(--tint);
      }
      .ans.right {
        border-color: var(--ok);
        background: var(--ok-bg);
      }
      .ans.right .mark {
        color: var(--ok);
      }
      .ans.wrong {
        border-color: var(--bad);
        background: var(--bad-bg);
      }
      .ans.wrong .mark {
        color: var(--bad);
      }
      .ans.missed {
        border-style: dashed;
        border-color: var(--ok);
      }
      .ans.missed .mark {
        color: var(--ok);
      }
      .ans:disabled {
        cursor: default;
        color: var(--fg);
      }
      .feedback {
        margin-top: 18px;
        border-radius: 10px;
        padding: 14px 16px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-left: 6px solid var(--hema);
      }
      .feedback.ok {
        border-left-color: var(--ok);
      }
      .feedback.no {
        border-left-color: var(--bad);
      }
      .feedback h3 {
        font-size: 1.1rem;
        font-weight: 700;
      }
      .feedback.ok h3 {
        color: var(--ok);
      }
      .feedback.no h3 {
        color: var(--bad);
      }
      .feedback p + p {
        margin-top: 6px;
      }
      .qactions {
        display: flex;
        gap: 12px;
        margin-top: 18px;
        padding-bottom: 36px;
      }

      /* ---------- results ---------- */
      .score {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 16px;
        margin-top: 6px;
      }
      .score .big {
        font-family: var(--f-display);
        font-weight: 800;
        font-size: clamp(3rem, 14vw, 4.6rem);
        line-height: 1;
        color: var(--hema);
        font-variant-numeric: tabular-nums;
      }
      .score .pct {
        font-family: var(--f-mono);
        font-size: 1.1rem;
        color: var(--muted);
      }
      .rows {
        list-style: none;
        margin: 14px 0 0;
        padding: 0;
      }
      .rows li {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 4px 12px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .rows .tag {
        align-self: start;
      }
      .rows .bar {
        grid-column: 2 / 4;
      }
      .rows .num {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      .h-section {
        margin-top: 30px;
        font-size: 1.2rem;
        font-weight: 700;
      }
      .review {
        list-style: none;
        margin: 14px 0 0;
        padding: 0;
        display: grid;
        gap: 14px;
      }
      .review li {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
      }
      .review .q {
        font-weight: 600;
        margin-top: 6px;
      }
      .review .yours {
        color: var(--bad);
        margin-top: 8px;
      }
      .review .corr {
        color: var(--ok);
        margin-top: 2px;
      }
      .review .why {
        margin-top: 8px;
        color: var(--muted);
      }
      .review .yours b,
      .review .corr b {
        font-weight: 700;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .empty {
        margin-top: 20px;
        padding: 14px 16px;
        background: var(--tint);
        border-radius: 10px;
        color: var(--muted);
      }

      @media (max-width: 480px) {
        .btn {
          width: 100%;
        }
        .startbar .btn {
          flex: 1 1 100%;
        }
        .qactions .btn {
          flex: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .progress i {
          transition: none;
        }
      }

      /* ---------- chapter jump + collapse ---------- */
      .ch-jump {
        position: sticky;
        top: 0;
        z-index: 6;
        background: var(--bg);
        border-bottom: 1px solid var(--line);
        padding: 8px 0;
        margin: 0 0 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .ch-jump span {
        font-size: 0.78rem;
        color: var(--muted);
        margin-right: 4px;
      }
      .ch-jump a {
        font-family: var(--f-mono);
        font-size: 0.85rem;
        font-weight: 500;
        padding: 4px 10px;
        border-radius: 999px;
        background: var(--tint);
        color: var(--hema);
        text-decoration: none;
        border: 1px solid transparent;
      }
      .ch-jump a:hover {
        border-color: var(--hema);
      }
      .chapter.collapsed .secs,
      .chapter.collapsed .dsec,
      .chapter.collapsed .dgrid,
      .chapter.collapsed .ch-body {
        display: none;
      }
      .ch-head {
        cursor: pointer;
      }
      .ch-head .ch-toggle {
        margin-left: auto;
        font-size: 0.85rem;
        color: var(--muted);
        background: none;
        border: 0;
        padding: 4px 8px;
      }


      /* ---------- match game ---------- */
      .match-sets {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }
      .match-set {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 14px 16px;
        cursor: pointer;
        text-align: left;
        font: inherit;
        color: inherit;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .match-set:hover { border-color: var(--hema); }
      .match-set strong { color: var(--hema); }
      .match-board {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 16px;
      }
      @media (max-width: 640px) {
        .match-board { grid-template-columns: 1fr; }
      }
      .match-col h3 {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--muted);
        margin: 0 0 8px;
      }
      .m-card {
        background: var(--surface);
        border: 2px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
        cursor: grab;
        user-select: none;
        font-weight: 600;
      }
      .m-card.matched { border-color: var(--ok); background: var(--ok-bg); cursor: default; }
      .m-card.wrong { border-color: var(--bad); background: var(--bad-bg); animation: shake 0.3s; }
      @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
      .m-zone {
        border: 2px dashed var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        margin-bottom: 8px;
        min-height: 52px;
        background: var(--tint);
        font-size: 0.9rem;
        color: var(--muted);
      }
      .m-zone.over { border-color: var(--hema); background: #efe8f5; }
      .m-zone.filled { border-style: solid; background: var(--surface); color: var(--fg); }
      .m-zone.matched { border-color: var(--ok); background: var(--ok-bg); }

      /* ---------- tabs ---------- */
      .wrap.wide {
        max-width: 62rem;
      }
      .tabs {
        display: flex;
        gap: 4px;
        border-bottom: 1px solid var(--line);
        margin: -8px 0 20px;
      }
      .tab {
        border: 0;
        background: none;
        padding: 10px 16px;
        font-family: var(--f-display);
        font-weight: 700;
        font-size: 1rem;
        color: var(--muted);
        border-bottom: 3px solid transparent;
        margin-bottom: -1px;
        min-height: 44px;
      }
      .tab:hover {
        color: var(--fg);
      }
      .tab[aria-current="page"] {
        color: var(--hema);
        border-bottom-color: var(--accent);
      }

      /* ---------- diagram picker ---------- */
      .dsec {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 4px 10px;
        margin-top: 16px;
      }
      .dsec h3 {
        font-size: 1.05rem;
        font-weight: 700;
        margin: 0;
      }
      .dsec .count {
        margin-left: auto;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .dgrid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(10.5rem, 1fr));
        gap: 12px;
        margin-top: 12px;
      }
      .dcard {
        display: grid;
        gap: 6px;
        align-content: start;
        text-align: left;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 8px 8px 10px;
      }
      .dcard:hover {
        border-color: var(--hema);
      }
      .dthumb {
        display: block;
        aspect-ratio: 4 / 3;
        background: #ffffff;
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid var(--line);
      }
      .dthumb img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .dtitle {
        font-weight: 700;
        line-height: 1.2;
        padding: 2px 2px 0;
      }
      .dmeta {
        font-size: 0.83rem;
        color: var(--muted);
        padding: 0 2px;
        line-height: 1.3;
        font-variant-numeric: tabular-nums;
      }
      .dmeta.good {
        color: var(--ok);
      }

      /* ---------- game ---------- */
      .dg-top {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        justify-content: space-between;
        gap: 6px 14px;
      }
      .dg-title {
        font-family: var(--f-display);
        font-size: clamp(1.7rem, 5.5vw, 2.4rem);
        line-height: 1.05;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: var(--hema);
        margin: 6px 0 4px;
      }
      .dg-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 10px 12px;
        align-items: center;
        margin-top: 14px;
      }
      .dg-seg {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;

                                                                                                                                    <script>
      (function () {
        "use strict";
        var DIAGRAMS = window.DIAGRAMS || [];

        /* ---------- storage (per viewer; page works without it) ---------- */
        var KEY = "anatomy-drill-v1";
        var memFallback = {};
        function readStore() {
          try {
            var raw = localStorage.getItem(KEY);
            return raw ? JSON.parse(raw) : {};
          } catch (e) {
            return memFallback;
          }
        }
        var store = readStore();
        store.stats = store.stats || {};
        store.prefs = store.prefs || {};
        function persist() {
          try {
            localStorage.setItem(KEY, JSON.stringify(store));
          } catch (e) {
            memFallback = store;
          }
        }

        /* ---------- question bank ---------- */
        function hid(s) {
          var h = 5381;
          for (var i = 0; i < s.length; i++)
            h = ((h << 5) + h + s.charCodeAt(i)) | 0;
          return "q" + (h >>> 0).toString(36);
        }
        var QS = BANK.map(function (r) {
          var sec = r[0],
            text = r[1];
          if (typeof r[2] === "boolean") {
            return {
              id: hid(sec + text),
              sec: sec,
              text: text,
              type: "tf",
              opts: [
                { t: "True", ok: r[2] === true },
                { t: "False", ok: r[2] === false },
              ],
              why: r[3],
            };
          }
          var opts = r[2]
            .map(function (t) {
              return { t: t, ok: true };
            })
            .concat(
              r[3].map(function (t) {
                return { t: t, ok: false };
              }),
            );
          return {
            id: hid(sec + text),
            sec: sec,
            text: text,
            type: r[2].length > 1 ? "multi" : "single",
            opts: opts,
            why: r[4],
          };
        });
        var SEC = {};
        SECTIONS.forEach(function (s) {
          SEC[s.id] = s;
        });

        /* ---------- helpers ---------- */
        function esc(s) {
          return String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }
        function shuffle(a) {
          a = a.slice();
          for (var i = a.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1)),
              t = a[i];
            a[i] = a[j];
            a[j] = t;
          }
          return a;
        }
        function countFor(secId) {
          return QS.filter(function (q) {
            return q.sec === secId;
          });
        }
        function mastered(secId) {
          return countFor(secId).filter(function (q) {
            return store.stats[q.id] && store.stats[q.id].last === true;
          }).length;
        }
        function missedQs() {
          return QS.filter(function (q) {
            return store.stats[q.id] && store.stats[q.id].last === false;
          });
        }
        function pct(n, d) {
          return d ? Math.round((n / d) * 100) : 0;
        }
        var LETTERS = "ABCDE";

        /* ---------- state ---------- */
        var prefs = {
          sel: Array.isArray(store.prefs.sel)
            ? store.prefs.sel.filter(function (id) {
                return SEC[id];
              })
            : SECTIONS.map(function (s) {
                return s.id;
              }),
          count: store.prefs.count || 20,
          shuffle: store.prefs.shuffle !== false,

        // Sections added after a viewer saved their selection start out selected.
        var known = Array.isArray(store.prefs.known)
          ? store.prefs.known
          : store.prefs.sel
            ? SECTIONS.filter(function (s) {
                return s.ch !== "V";
              }).map(function (s) {
                return s.id;
              })
            : [];
        SECTIONS.forEach(function (s) {
          if (known.indexOf(s.id) < 0 && prefs.sel.indexOf(s.id) < 0)

              '<section class="chapter' +

            "</div>" +
            '<button type="button" class="link" data-act="clear-all" data-key="clearall">Clear all</button>' +
            '<label class="check"><input type="checkbox" data-act="shuffle" data-key="shuf"' +
            (prefs.shuffle ? " checked" : "") +
            "> Shuffle answers</label></div>" +
            '<button class="btn" data-act="start" data-key="start"' +
            (n ? "" : " disabled") +
            ">" +
            (n

              : '<button class="link" data-act="reset" data-key="reset">Reset progress</button>') +
            "</div>";

        }

        function initMatchBoard() {

          termsEl.innerHTML = "";

          var defs = shuffle(set.pairs.slice());
          terms.forEach(function (p) {
            var card = document.createElement("div");
            card.className = "m-card";
            card.draggable = true;
            card.dataset.term = p[0];
            card.textContent = p[0];
            card.addEventListener("dragstart", function (e) {
              if (card.classList.contains("matched")) { e.preventDefault(); return; }
              e.dataTransfer.setData("text/plain", p[0]);
            });
            termsEl.appendChild(card);
          });
          defs.forEach(function (p) {
            var zone = document.createElement("div");
            zone.className = "m-zone";
            zone.dataset.correct = p[0];
            zone.dataset.def = p[1];
            zone.textContent = p[1];
            zone.addEventListener("dragover", function (e) { e.preventDefault(); if (!zone.classList.contains("filled")) zone.classList.add("over"); });
            zone.addEventListener("dragleave", function () { zone.classList.remove("over"); });
            zone.addEventListener("drop", function (e) {
              e.preventDefault();
              zone.classList.remove("over");
              if (zone.classList.contains("filled")) return;
              var term = e.dataTransfer.getData("text/plain");
              var card = document.querySelector('.m-card[data-term="' + CSS.escape(term) + '"]');
              if (!card || card.classList.contains("matched")) return;
              if (term === zone.dataset.correct) {
                card.classList.add("matched");
                card.draggable = false;
                zone.classList.add("filled", "matched");
                zone.innerHTML = "<strong>" + term + "</strong><br><span style='font-weight:400;color:var(--muted)'>" + zone.dataset.def + "</span>";
                var done = document.querySelectorAll(".m-card.matched").length;
                var st = document.getElementById("m-status");
                if (st) st.textContent = done + " of " + set.pairs.length + " matched" + (done === set.pairs.length ? " — done!" : "");
              } else {
                card.classList.add("wrong");
                setTimeout(function () { card.classList.remove("wrong"); }, 350);
              }
            });
            defsEl.appendChild(zone);
          });

                function render() {

        /* ---------- actions ---------- */
        function reveal() {

          });

          quiz.log.push({ q: q, ok: ok, picked: quiz.picked.slice() });
          var prev = store.stats[q.id] || { right: 0, wrong: 0 };
          store.stats[q.id] = {
            last: ok,
            right: prev.right + (ok ? 1 : 0),
            wrong: prev.wrong + (ok ? 0 : 1),

          persist();

        function pickOption(i) {
          if (!quiz || quiz.revealed) return;

          if (q.type === "multi") {
            var at = quiz.picked.indexOf(i);
            if (at >= 0) quiz.picked.splice(at, 1);
            else quiz.picked.push(i);

            quiz.picked = [i];
            reveal();

            '<button type="button" class="btn small" data-act="dg-new" data-key="gnew">New round</button>' +
            '<button type="button" class="btn ghost small" data-act="dg-reset" data-key="greset">Start over</button>' +
            '<button type="button" class="btn ghost small" data-act="dg-show" data-key="gshow">Show answers</button>' +
            '<span class="dg-spacer"></span><span class="dg-score" id="gScore"></span></div>' +
            '<div class="dg-meter" aria-hidden="true"><i id="gMeter"></i></div>' +
            '<div class="dg-board"><div class="dg-traywrap"><section class="tray" aria-labelledby="gTrayH"><h2 id="gTrayH">Labels <small id="gCount"></small></h2>' +
            '<div class="dg-sortrow"><button type="button" class="link" data-act="dg-shuffle" data-key="gsh">Shuffle</button><button type="button" class="link" data-act="dg-az" data-key="gaz">A&ndash;Z</button></div>' +
            '<ul class="tiles" id="gTiles"></ul><p class="tray-empty" id="gEmpty" hidden>No labels left.</p><p class="dg-status" id="gStatus" role="status" aria-live="polite"></p></section></div>' +
            '<div class="dg-stagewrap"><p class="dg-hint">Swipe the diagram sideways to reach every spot.</p><div class="stage"><div class="fig" id="gFig"></div></div></div></div>' +
            '<section class="dg-done" id="gDone" hidden><h2 id="gDoneH"></h2><p id="gDoneP"></p><div class="row">' +
            '<button type="button" class="btn" data-act="dg-new" data-key="gagain">New round</button>' +
            '<button type="button" class="btn ghost" data-act="dg-back" data-key="gback2">Back to diagrams</button></div></section>' +
            '<p class="credit">' +
            DCREDIT +
            "</p>"
          );
        }

        var gZones = {};
        function mountGame(d) {
          view = "dgame";
          wrapEl.classList.add("wide");
          app.innerHTML = gameShell(d);
          var fig = document.getElementById("gFig");
          var img = document.createElement("img");
          img.src = d.image;
          img.alt =
            d.title +
            ". The text of the covered labels is hidden for the exercise.";
          img.width = d.w;
          img.height = d.h;
          img.draggable = false;
          fig.appendChild(img);
          gZones = {};
          G.hidden
            .slice()
            .sort(function (a, b) {
              return a.y - b.y || a.x - b.x;
            })
            .forEach(function (l, i, arr) {
              var z = document.createElement("button");
              z.type = "button";
              z.className = "zone" + (l.align === "left" ? " left" : "");
              z.dataset.id = l.id;
              z.style.left = (l.x / d.w) * 100 + "%";
              z.style.top = (l.y / d.h) * 100 + "%";
              z.style.width = (l.w / d.w) * 100 + "%";
              z.style.height = (l.h / d.h) * 100 + "%";
              z.style.background = l.bg;
              z.style.fontSize = (l.fs / d.w) * 100 + "cqw";
              z.style.lineHeight = l.lhr;
              z.setAttribute(
                "aria-label",
                "Empty label spot " + (i + 1) + " of " + arr.length,
              );
              fig.appendChild(z);
              gZones[l.id] = z;
            });
          bindGame(fig, document.getElementById("gTiles"));
          gRender();
          window.scrollTo(0, 0);
        }
        function gSay(msg, kind) {
          var s = document.getElementById("gStatus");
          if (!s) return;
          s.textContent = msg;
          s.className = "dg-status" + (kind ? " " + kind : "");
        }
        function gPlacedCount() {
          return Object.keys(G.placed).length;
        }
        function gRenderZones() {
          G.hidden.forEach(function (l) {
            var z = gZones[l.id],
              isP = !!G.placed[l.id],
              isS = !!G.shown[l.id];
            z.classList.toggle("placed", isP);
            z.classList.toggle("shown", isS && !isP);
            z.classList.toggle("target", !!G.sel && !isP && !isS);
            z.textContent = isP || isS ? l.disp : "";
            z.disabled = isP || isS;
            if (isP || isS) z.setAttribute("aria-label", l.text);
          });
        }
        function gRemaining() {
          var left = {};
          G.hidden.forEach(function (l) {
            if (!G.placed[l.id] && !G.shown[l.id])
              left[l.text] = (left[l.text] || 0) + 1;
          });
          return left;
        }
        function gRenderTray() {
          var ul = document.getElementById("gTiles");
          ul.innerHTML = "";
          var left = gRemaining(),
            shownTiles = 0;
          G.order.forEach(function (t) {
            if (!left[t]) return;
            var li = document.createElement("li"),
              b = document.createElement("button");
            b.type = "button";
            b.className = "tile";
            b.dataset.text = t;
            b.setAttribute("aria-pressed", G.sel === t ? "true" : "false");
            var span = document.createElement("span");
            span.textContent = t;
            b.appendChild(span);
            if (left[t] > 1) {
              var x = document.createElement("span");
              x.className = "x2";
              x.textContent = "×" + left[t];
              b.appendChild(x);
            }
            li.appendChild(b);
            ul.appendChild(li);
            shownTiles++;
          });
          var total = Object.keys(left).reduce(function (s, k) {
            return s + left[k];
          }, 0);
          document.getElementById("gCount").textContent = total + " left";
          document.getElementById("gEmpty").hidden = shownTiles > 0;
        }
        function gRenderMeta() {
          var p = gPlacedCount(),
            n = G.hidden.length;
          document.getElementById("gScore").innerHTML =
            "<b>" +
            p +
            "</b> of " +
            n +
            " placed &middot; <b>" +
            G.misses +
            "</b> miss" +
            (G.misses === 1 ? "" : "es");
          document.getElementById("gMeter").style.width = (p / n) * 100 + "%";
          var all = p + Object.keys(G.shown).length >= n,
            won = p === n;
          document.getElementById("gDone").hidden = !all;
          if (all) {
            document.getElementById("gDoneH").textContent = won
              ? "All labels placed"
              : "Answers shown";
            document.getElementById("gDoneP").textContent = won
              ? G.misses === 0
                ? "No misses. Every label went to the right spot on the first try."
                : G.misses +
                  " miss" +
                  (G.misses === 1 ? "" : "es") +
                  " along the way. Start a new round to try again."
              : "Start a new round to test yourself.";
            if (won && !G.recorded) {
              G.recorded = true;
              var prev = store.dg[G.d.id] || { rounds: 0 };
              store.dg[G.d.id] = {
                rounds: prev.rounds + 1,
                last: { n: n, miss: G.misses },
              };
              persist();
            }
          }

        }
        function gRender() {
          gRenderZones();
          gRenderTray();
          gRenderMeta();
        }

        function gFlash(el) {
          if (!el) return;
          el.classList.remove("bad");
          void el.offsetWidth;
          el.classList.add("bad");
          setTimeout(function () {
            el.classList.remove("bad");
          }, 400);
        }
        function gAttempt(text, zoneId) {
          if (!G || G.placed[zoneId] || G.shown[zoneId]) return;
          var label = null;
          G.hidden.forEach(function (l) {
            if (l.id === zoneId) label = l;
          });
          if (!label) return;
          if (label.text === text) {
            G.placed[zoneId] = true;
            G.sel = null;
            gSay("Correct: " + text, "ok");
            gRender();
          } else {
            G.misses++;
            gSay(
              "Not that one. Follow the line or bracket from this spot.",
              "no",
            );
            gRenderMeta();
            gFlash(gZones[zoneId]);
            var tiles = document.querySelectorAll("#gTiles .tile");
            Array.prototype.forEach.call(tiles, function (t) {
              if (t.dataset.text === text) gFlash(t);
            });
          }
        }

        /* ---------- tray interaction: drag, or tap then tap ---------- */
        function zoneAt(x, y) {
          var els = document.elementsFromPoint(x, y);
          for (var i = 0; i < els.length; i++) {
            var el = els[i];
            if (
              el.classList &&
              el.classList.contains("zone") &&
              !el.classList.contains("placed") &&
              !el.classList.contains("shown")
            )
              return el;
          }
          return null;
        }
        function clearHot() {
          Object.keys(gZones).forEach(function (k) {
            gZones[k].classList.remove("hot");
          });
        }
        function endDrag() {
          if (!dragG) return;
          if (dragG.ghost && dragG.ghost.parentNode)
            dragG.ghost.parentNode.removeChild(dragG.ghost);
          if (dragG.tile) dragG.tile.classList.remove("dragging");
          clearHot();
          dragG = null;
        }
        function bindGame(fig, tiles) {
          tiles.addEventListener("pointerdown", function (e) {
            var t = e.target.closest(".tile");
            if (!t || (e.pointerType === "mouse" && e.button !== 0)) return;
            dragG = {
              text: t.dataset.text,
              tile: t,
              sx: e.clientX,
              sy: e.clientY,
              moved: false,
              ghost: null,
              pid: e.pointerId,
            };
            try {
              t.setPointerCapture(e.pointerId);
            } catch (err) {}
          });
          tiles.addEventListener("pointermove", function (e) {
            if (!dragG || e.pointerId !== dragG.pid) return;
            if (!dragG.moved) {
              if (Math.hypot(e.clientX - dragG.sx, e.clientY - dragG.sy) < 6)
                return;
              dragG.moved = true;
              var g = dragG.tile.cloneNode(true);
              g.classList.add("dragghost");
              g.removeAttribute("aria-pressed");
              g.style.width = dragG.tile.getBoundingClientRect().width + "px";
              document.body.appendChild(g);
              dragG.ghost = g;
              dragG.tile.classList.add("dragging");
              G.sel = null;
              gRenderZones();
            }
            dragG.ghost.style.transform =
              "translate(" +
              (e.clientX - 24) +
              "px," +
              (e.clientY - 20) +
              "px)";
            clearHot();
            var z = zoneAt(e.clientX, e.clientY);
            if (z) z.classList.add("hot");
          });
          tiles.addEventListener("pointerup", function (e) {
            if (!dragG || e.pointerId !== dragG.pid) return;
            var d = dragG,
              moved = d.moved,
              z = moved ? zoneAt(e.clientX, e.clientY) : null;
            endDrag();
            if (moved) {
              suppressClick = true;
              setTimeout(function () {
                suppressClick = false;
              }, 0);
              if (z) gAttempt(d.text, z.dataset.id);
              else gSay("Drop the label on one of the dashed spots.");
            }
          });
          tiles.addEventListener("pointercancel", endDrag);
          tiles.addEventListener("click", function (e) {
            var t = e.target.closest(".tile");
            if (!t || suppressClick) return;
            G.sel = G.sel === t.dataset.text ? null : t.dataset.text;
            gSay(G.sel ? "Now tap or press the spot for “" + G.sel + "”." : "");
            gRenderZones();
            gRenderTray();
            if (G.sel) {
              var again = Array.prototype.filter.call(
                document.querySelectorAll("#gTiles .tile"),
                function (x) {
                  return x.dataset.text === G.sel;
                },
              )[0];
              if (again) again.focus({ preventScroll: true });
            }
          });
          fig.addEventListener("click", function (e) {
            var z = e.target.closest(".zone");
            if (!z || z.disabled) return;
            if (!G.sel) {
              gSay("Pick a label from the tray first.");
              return;
            }
            gAttempt(G.sel, z.dataset.id);
          });
        }

        /* ---------- navigation and controls ---------- */
        function leaveGame() {
          endDrag();
          G = null;
          wrapEl.classList.remove("wide");
        }
        app.addEventListener("click", function (e) {
          var el = e.target.closest("[data-act]");
          if (!el || el.disabled) return;
          var act = el.dataset.act;
          if (act === "tab") {
            if (el.dataset.tab === "d") {
              view = "dhome";
              store.tab = "d";
            } else if (el.dataset.tab === "m") {
              view = "mhome";
              store.tab = "m";
            } else {
              view = "dhome";
              store.tab = "q";
            }
            persist();
            render();
            window.scrollTo(0, 0);
          } else if (act === "match-check") {
            e.preventDefault();
            var id = el.dataset.id;
            var i = matchSel.indexOf(id);
            if (i >= 0) matchSel.splice(i, 1);
            else matchSel.push(id);
            render();
          } else if (act === "match-clear") {
            matchSel = [];
            render();
          } else if (act === "match-start-sel") {
            if (!matchSel.length) return;
            matchQueue = matchSel.slice();
            matchQueueIndex = 0;
            currentMatch = matchQueue[0];
            view = "match";
            render();
            window.scrollTo(0, 0);
            setTimeout(initMatchBoard, 0);
          } else if (act === "match-open") {
            matchQueue = [el.dataset.id];
            matchQueueIndex = 0;
            currentMatch = el.dataset.id;
            view = "match";
            render();
            window.scrollTo(0, 0);
            setTimeout(initMatchBoard, 0);
          } else if (act === "match-back") {
            view = "mhome";
            currentMatch = null;
            matchQueue = [];
            render();
            window.scrollTo(0, 0);
          } else if (act === "match-next") {
            if (matchQueueIndex < matchQueue.length - 1) {
              matchQueueIndex++;
              currentMatch = matchQueue[matchQueueIndex];
              render();
              setTimeout(initMatchBoard, 0);
            } else {
              view = "mhome";
              currentMatch = null;
              matchQueue = [];
              render();
            }
            window.scrollTo(0, 0);
          } else if (act === "match-reset") {
            render();
            setTimeout(initMatchBoard, 0);
          } else if (act === "match-show") {
            document.querySelectorAll(".m-card").forEach(function (c) {
              if (!c.classList.contains("matched")) {
                c.classList.add("matched");
                c.draggable = false;
              }
            });
            document.querySelectorAll(".m-zone").forEach(function (z) {
              if (!z.classList.contains("filled")) {
                z.classList.add("filled", "matched");
                z.innerHTML = "<strong>" + z.dataset.correct + "</strong><br><span style='font-weight:400;color:var(--muted)'>" + z.dataset.def + "</span>";
              }
            });
            var st = document.getElementById("m-status");
            if (st) st.textContent = "Answers shown";
          } else if (act === "dg-open") {
            var d = DBY[el.dataset.id];
            if (!d) return;
            startRound(d, true);
            mountGame(d);
          } else if (act === "dg-back") {
            leaveGame();
            view = "dhome";
            render();
            window.scrollTo(0, 0);
          } else if (act === "dg-new") {
            startRound(G.d, true);
            mountGame(G.d);
          } else if (act === "dg-reset") {
            startRound(G.d, false);
            mountGame(G.d);
          } else if (act === "dg-show") {
            G.hidden.forEach(function (l) {
              if (!G.placed[l.id]) G.shown[l.id] = true;
            });
            G.sel = null;
            gSay("Answers shown. They do not count as placed.");
            gRender();
          } else if (act === "dg-shuffle") {
            G.order = shuffle(G.order);
            gRenderTray();
          } else if (act === "dg-az") {
            G.order = G.order.slice().sort(function (a, b) {
              return a.localeCompare(b);
            });
            gRenderTray();
          }
        });
        if (store.tab === "d") view = "dhome";
        if (store.tab === "m") view = "mhome";

        render();
      })();
    </script>
  </body>
</html>
